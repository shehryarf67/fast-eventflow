<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">EventFlow proposed information architecture</title><desc id="desc">My Requests is the hub, with request details, correction, validation and confirmation. New Request and Help are top-level destinations. All request paths return to the hub.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#222"/></marker></defs><rect width="960" height="500" fill="white"/><g font-family="Arial,sans-serif" fill="#181818"><text x="30" y="30" font-size="20" font-weight="bold">Team proposed hub and spoke navigation</text><g fill="none" stroke="#333" stroke-width="2" marker-end="url(#arr)"><path d="M190 110V170"/><path d="M480 110V360"/><path d="M190 230V290"/><path d="M190 350V410H390"/><path d="M570 390H650"/><path d="M740 360V230H280" stroke-dasharray="6 4"/><path d="M480 420V465H90V110"/><path d="M770 110V170"/></g><g fill="#eee" stroke="#333"><rect x="100" y="60" width="180" height="50"/><rect x="390" y="60" width="180" height="50"/><rect x="680" y="60" width="180" height="50"/><rect x="80" y="170" width="220" height="60"/><rect x="80" y="290" width="220" height="60"/><rect x="390" y="360" width="180" height="60"/><rect x="650" y="360" width="220" height="60"/><rect x="650" y="170" width="220" height="60"/></g><g text-anchor="middle" font-size="16"><text x="190" y="91">My Requests W1 W2</text><text x="480" y="91">New Request W9</text><text x="770" y="91">Help W10</text><text x="190" y="195">Request detail W3 W4 W5</text><text x="190" y="217" font-size="13">Stage, reason and history</text><text x="190" y="316">Edit and resubmit W6</text><text x="190" y="338" font-size="13">Only Changes needed</text><text x="480" y="386">Validation W7</text><text x="480" y="408" font-size="13">Correct and retry</text><text x="760" y="386">Confirmation W8</text><text x="760" y="408" font-size="13">Updated stage and expected date</text><text x="760" y="195">Stage and task guidance</text><text x="760" y="217" font-size="13">Available globally</text></g><text x="310" y="457" font-size="13">Return to My Requests from details and confirmation</text><text x="30" y="492" font-size="12">Solid paths show task entry. Dashed return represents continued inspection of the same request.</text></g></svg>